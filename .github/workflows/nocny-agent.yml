name: nocny-agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

# Tylko JEDNO uruchomienie naraz. Zapobiega nakładaniu się (ręczne + cron),
# które kasowało sobie nawzajem trwający przebieg (ForeignKeyViolation).
concurrency:
  group: nocny-agent
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python runner.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
